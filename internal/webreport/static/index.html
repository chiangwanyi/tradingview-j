<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据分析 · tradingview-j</title>
<link rel="icon" href="data:,">
<script>
// 样式起来之前先把主题类挂上，否则深色模式下会闪一下白底
try { if (localStorage.getItem('tvj-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
</script>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/tailwind.js"></script>
<style type="text/tailwindcss">
/* 调色板本身定义在 style.css 的 :root / html.dark 里（纯 CSS 变量），
   这里只用 @theme inline 把它们注册成 Tailwind 的颜色名 —— 这样：
     · 深色模式只需要换一遍变量值，不用给每个类补 dark: 变体；
     · 即使某个颜色名没被任何工具类用到，样式表里那两个变量也一定存在，
        style.css 里的 .card / .tbl 不会因为「变量被摇掉了」而变成透明。 */
@custom-variant dark (&:where(.dark, .dark *));
@theme inline {
  --color-bg: var(--bg);            --color-panel: var(--panel);     --color-panel2: var(--panel2);
  --color-line: var(--line);        --color-line2: var(--line2);
  --color-ink: var(--ink);          --color-muted: var(--muted);     --color-faint: var(--faint);
  --color-accent: var(--accent);    --color-accentbg: var(--accentbg); --color-accentbd: var(--accentbd);
  --color-ok: var(--ok);            --color-okbg: var(--okbg);
  --color-warn: var(--warn);        --color-warnbg: var(--warnbg);   --color-warnbd: var(--warnbd);
  --color-bad: var(--bad);          --color-badbg: var(--badbg);     --color-badbd: var(--badbd);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
}
</style>
</head>
<body class="bg-bg font-sans text-ink antialiased">
<div id="app" v-cloak>

  <!-- ── 顶栏 ─────────────────────────────────────────────────────── -->
  <header class="sticky top-0 z-20 border-b border-line bg-bg">
    <div class="mx-auto flex max-w-[1440px] flex-wrap items-center gap-x-4 gap-y-2 px-5 py-2.5">
      <div class="min-w-0">
        <h1 class="text-[15px] font-semibold leading-tight">数据分析</h1>
        <p class="truncate font-mono text-[11.5px] leading-tight text-faint" :title="meta.root">{{ meta.root }}</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <span v-if="loading" class="text-[12px] text-muted">扫描中…</span>
        <span v-else-if="snapshot" class="text-[11.5px] text-faint" :title="'这次扫描花了 ' + meta.scanMs + ' 毫秒'">{{ snapshot }}</span>
        <button class="btn" type="button" @click="load" :disabled="loading">重新扫描</button>
        <button class="btn" type="button" @click="toggleDark" :title="dark ? '切到浅色' : '切到深色'">{{ dark ? '浅色' : '深色' }}</button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1440px] px-5 pb-16 pt-4">

    <!-- ── 拉取失败 ─────────────────────────────────────────────────── -->
    <section v-if="err" class="alert alert-bad mb-4">
      <p class="text-[13px] font-medium">读不到统计数据：{{ err }}</p>
      <p class="mt-1 text-[12px] opacity-80">服务可能已经停了。回到程序窗口重新选一次「网页版分析」即可。</p>
    </section>

    <div v-if="!rep" class="py-20 text-center text-[13px] text-muted">正在读取…</div>

    <template v-if="rep">

      <!-- ── 总览 ──────────────────────────────────────────────────── -->
      <section class="mb-4 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
        <div class="card px-3.5 py-3">
          <div class="stat-lbl">标的</div>
          <div class="stat-val">{{ num(totals.symbols) }}</div>
        </div>
        <div class="card px-3.5 py-3">
          <div class="stat-lbl">日文件</div>
          <div class="stat-val">{{ num(totals.days) }}</div>
        </div>
        <div class="card px-3.5 py-3">
          <div class="stat-lbl">K 线根数</div>
          <div class="stat-val">{{ num(totals.bars) }}</div>
        </div>
        <div class="card px-3.5 py-3">
          <div class="stat-lbl">占用磁盘</div>
          <div class="stat-val">{{ bytes(totals.bytes) }}</div>
        </div>
        <div class="card px-3.5 py-3">
          <div class="stat-lbl">一根 K 线</div>
          <div class="stat-val">{{ meta.step }}<span class="ml-1 text-[12px] font-normal text-muted">秒</span></div>
        </div>
        <div class="card px-3.5 py-3">
          <div class="stat-lbl">时区</div>
          <div class="stat-val-sm" :title="meta.tz">{{ meta.tz }}</div>
        </div>
      </section>

      <!-- ── 时间跨度 + 口径 ────────────────────────────────────────── -->
      <section class="mb-4 flex flex-wrap items-start gap-3">
        <div v-if="span" class="card min-w-[240px] flex-1 px-3.5 py-3">
          <div class="stat-lbl">时间跨度</div>
          <div class="mt-1 font-mono text-[13px]">{{ stamp(span.firstT) }}</div>
          <div class="font-mono text-[13px] text-muted">~ {{ stamp(span.lastT) }}</div>
        </div>
        <details class="card flex-1 basis-[420px] px-3.5 py-3">
          <summary class="cursor-pointer select-none text-[12.5px] font-medium">
            统计口径
            <span class="ml-1 font-normal text-faint">（和终端菜单 2 用的是同一份代码，数字一定一样）</span>
          </summary>
          <ul class="mt-2 space-y-1 text-[12px] leading-relaxed text-muted">
            <li><b class="text-ink">根数</b> = 该日文件里的 K 线行数（同一时间戳只算一根）。日历格子中间那个大数字就是它。</li>
            <li><b class="text-ink">缺口</b> = 首根与尾根之间按 {{ meta.step }} 秒推算应当有多少根，减去实有根数。期货每日结算休市、周末休市都会留下缺口，那是正常形态，不是丢数据 —— 所以有缺口的日只在格子角落写一行「缺N」，不算异常。</li>
            <li><b class="text-ink">最大断档</b> = 相邻两根之间最大的间隔（拖图时跳过了范围，或交易所休市）。</li>
            <li><b class="text-ink">坏行 / 重复行</b> = 解析不了的行数 / 同一时间戳出现多次的行数。正常写入是「整体重写 + 原子改名」，重复行应当恒为 0 —— 一旦不为 0，说明文件被手工改过或被别的工具合并过。这两种日文件在日历上整格标红（显示「异常」）。</li>
            <li><b class="text-ink">灰格子</b> = 这一天没有数据（周末、还没抓到的日期，或翻到了别的月份）。</li>
          </ul>
        </details>
      </section>

      <!-- ── 备注与告警 ────────────────────────────────────────────── -->
      <section v-if="alerts.length" class="mb-4 space-y-2">
        <div v-for="(a, i) in alerts" :key="'a' + i" class="alert" :class="a.cls">
          <p class="text-[12.5px]">{{ a.text }}</p>
        </div>
      </section>

      <!-- ── 空数据 ────────────────────────────────────────────────── -->
      <section v-if="!folders.length" class="card px-5 py-14 text-center">
        <p class="text-[14px] font-medium">{{ meta.exists ? '数据目录里还没有任何 K 线。' : '数据目录还不存在。' }}</p>
        <p class="mt-2 text-[12.5px] text-muted">先回到程序窗口选 1 启动抓取，然后在 TradingView 图表上拖一拖，数据就会落到这个目录里。</p>
        <p class="mt-1 font-mono text-[12px] text-faint">{{ meta.root }}</p>
      </section>

      <template v-if="folders.length">

        <!-- ── 工具条 ──────────────────────────────────────────────── -->
        <section class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-2">
          <input class="inp max-w-[220px]" type="search" v-model.trim="q" placeholder="筛选标的或日期，如 2026-10 / MES">
          <div class="cal-nav" title="日历月份（所有日历一起翻）">
            <button class="btn" type="button" @click="stepMonth(-1)">&lsaquo;</button>
            <select class="inp cal-month" v-model="month" @change="markMonthTouched">
              <option v-for="m in monthOptions" :key="m" :value="m">{{ m }}</option>
            </select>
            <button class="btn" type="button" @click="stepMonth(1)">&rsaquo;</button>
            <button class="btn" type="button" @click="gotoLatest" title="跳到最新有数据的月份">最新</button>
          </div>
          <label class="flex cursor-pointer select-none items-center gap-2 text-[12.5px] text-muted" title="只有坏行 / 重复行 / 读不了的日标红，其余变淡">
            <input type="checkbox" v-model="hlIssue">
            高亮异常日
          </label>
          <label class="flex cursor-pointer select-none items-center gap-2 text-[12.5px] text-muted" title="有缺口的日留原样，其余变淡">
            <input type="checkbox" v-model="hlGap">
            高亮有缺口的日
          </label>
          <span v-if="dayFilterOn" class="text-[12px] text-faint">
            命中的日文件：{{ num(hits.days) }} 天 · {{ num(hits.bars) }} 根
            <span v-if="hlIssue || hlGap">（没命中的日子只是变淡，不隐藏）</span>
          </span>
          <span v-else class="text-[12px] text-faint">点日历上的某一天看当天明细</span>
          <button class="btn ml-auto" type="button" @click="allOpen = !allOpen">{{ allOpen ? '全部折叠' : '全部展开' }}</button>
        </section>

        <!-- ── 每个标的 ────────────────────────────────────────────── -->
        <section v-for="f in shownFolders" :key="f.folder" class="mb-4">
          <div class="card">
            <header class="flex flex-wrap items-center gap-x-3 gap-y-1 border-b border-line px-4 py-2.5">
              <button class="toggler" type="button" @click="toggleFolder(f.folder)" :title="isOpen(f.folder) ? '折叠' : '展开'">
                <svg class="h-3 w-3" :class="isOpen(f.folder) ? 'rotate-90' : ''" viewBox="0 0 12 12" aria-hidden="true">
                  <path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </button>
              <h2 class="font-mono text-[13.5px] font-semibold">{{ f.symbol }}</h2>
              <span v-if="f.known && !sameName(f)" class="badge badge-accent" title="数据存在这个文件夹里">目录 {{ f.folder }}/</span>
              <span v-else-if="!f.known" class="badge badge-warn" title="_symbols.json 里没有登记这个文件夹，标的按文件夹名显示">未登记</span>
              <span v-if="f.skipped || f.dupes" class="badge badge-bad">坏 {{ num(f.skipped) }} / 重复 {{ num(f.dupes) }}</span>

              <div class="ml-auto flex flex-wrap items-center gap-x-4 gap-y-1 text-[12px] text-muted">
                <span>{{ num(f.days) }} 天 · {{ num(f.bars) }} 根 · {{ bytes(f.bytes) }}</span>
                <span v-if="f.hasTime" class="font-mono text-faint">{{ stamp(f.firstT) }} ~ {{ stamp(f.lastT) }}</span>
              </div>
            </header>

            <div v-if="isOpen(f.folder)" class="px-4 pb-4">
              <div class="cal-row">
                <div class="cal-col">
                  <cal-grid :cells="cellsOf(f)" @pick="pickDay(f, $event)"></cal-grid>
                  <p v-if="!monthHasData(f)" class="mt-2 text-[12px] text-faint">
                    {{ curMonth }} 这个标的没有数据 —— 用上面的 ‹ › 或月份下拉换一个。
                  </p>
                  <p v-else-if="dayFilterOn" class="mt-2 text-[12px] text-faint">
                    本月命中 {{ num(filesOf(f).length) }} 天 · {{ num(sumOf(f).bars) }} 根{{ sumOf(f).missing ? ' · 缺口 ' + num(sumOf(f).missing) : '' }}
                  </p>
                </div>

                <!-- 点某一天 → 当天的具体数据 -->
                <template v-for="d in one(pickedDay(f))" :key="d.date">
                  <div class="detail-col">
                    <div class="card px-4 py-3">
                      <div class="flex flex-wrap items-baseline gap-x-2 gap-y-1">
                        <h3 class="font-mono text-[14px] font-semibold">{{ d.date }}</h3>
                        <span class="text-[12px] text-muted">{{ weekday(d.date) }}</span>
                        <span class="text-[11.5px] text-faint">{{ f.symbol }}</span>
                        <button class="btn ml-auto" type="button" @click="pickDay(f, d)">收起</button>
                      </div>

                      <div v-if="d.err" class="alert alert-bad mt-2">
                        <p class="text-[12px]">这份文件没统计到：{{ d.err }}</p>
                      </div>

                      <div class="mt-2 grid grid-cols-2 gap-x-4 gap-y-2 sm:grid-cols-3">
                        <div>
                          <div class="stat-lbl">根数</div>
                          <div class="font-mono text-[13px]">{{ num(d.bars) }}</div>
                        </div>
                        <div>
                          <div class="stat-lbl">首根</div>
                          <div class="font-mono text-[13px]">{{ d.bars ? clock(d.firstT) : '—' }}</div>
                        </div>
                        <div>
                          <div class="stat-lbl">尾根</div>
                          <div class="font-mono text-[13px]">{{ d.bars ? clock(d.lastT) : '—' }}</div>
                        </div>
                        <div>
                          <div class="stat-lbl">缺口</div>
                          <div class="font-mono text-[13px]" :class="d.missing ? 'text-warn' : 'text-faint'"
                               :title="'首尾之间按 ' + meta.step + ' 秒推算应当有 ' + num(d.span) + ' 根'">
                            {{ d.missing ? num(d.missing) : '—' }}
                          </div>
                        </div>
                        <div>
                          <div class="stat-lbl">最大断档</div>
                          <div class="font-mono text-[13px]">{{ d.bars > 1 ? gap(d.maxGap) : '—' }}</div>
                        </div>
                        <div>
                          <div class="stat-lbl">文件大小</div>
                          <div class="font-mono text-[13px]">{{ bytes(d.bytes) }}</div>
                        </div>
                        <div>
                          <div class="stat-lbl">文件行数</div>
                          <div class="font-mono text-[13px]" :title="'= 根数 ' + num(d.bars) + ' + 坏行 ' + num(d.skipped) + ' + 重复行 ' + num(d.dupes)">
                            {{ num(d.rows) }}
                          </div>
                        </div>
                        <div>
                          <div class="stat-lbl">首尾跨度</div>
                          <div class="font-mono text-[13px]">{{ num(d.span) }} 根</div>
                        </div>
                        <div>
                          <div class="stat-lbl">写入检查</div>
                          <div class="text-[13px]">
                            <span v-if="rowIssue(d)" class="badge badge-bad">
                              <template v-if="d.skipped">坏 {{ num(d.skipped) }} 行 </template>
                              <template v-if="d.dupes">重复 {{ num(d.dupes) }} 行</template>
                            </span>
                            <span v-else class="text-faint">正常</span>
                          </div>
                        </div>
                      </div>

                      <p class="mt-2 font-mono text-[11.5px] text-faint">{{ f.folder }}/{{ d.date }}.csv</p>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </section>

        <!-- ── 全部标的合计（只有一个标的时没有信息量） ──────────────── -->
        <section v-if="folders.length > 1" class="mb-4">
          <div class="card">
            <header class="border-b border-line px-4 py-2.5">
              <h2 class="text-[13.5px] font-semibold">全部标的按日期合计</h2>
              <p class="text-[12px] text-muted">格子中间的数字 = 这一天所有标的加起来多少根；小字 = 有几个标的有数据。点一天看当天各标的各自的数字。</p>
            </header>
            <div class="px-4 pb-4 pt-3">
              <div class="cal-row">
                <div class="cal-col">
                  <cal-grid :cells="gCells()" @pick="pickGlobal($event)"></cal-grid>
                  <p v-if="!byDateAll.length" class="mt-2 text-[12px] text-faint">这段时间里还没抓到任何数据。</p>
                </div>

                <template v-for="r in one(gRow)" :key="r.date">
                  <div class="detail-col">
                    <div class="card">
                      <header class="flex flex-wrap items-baseline gap-x-3 gap-y-1 border-b border-line px-4 py-2.5">
                        <h3 class="font-mono text-[14px] font-semibold">{{ r.date }}</h3>
                        <span class="text-[12px] text-muted">{{ weekday(r.date) }}</span>
                        <span class="text-[12px] text-muted">{{ num(r.symbols) }} 个标的 · 合计 {{ num(r.bars) }} 根</span>
                        <button class="btn ml-auto" type="button" @click="gPicked = ''">收起</button>
                      </header>
                      <div class="overflow-x-auto">
                        <table class="tbl">
                          <thead>
                            <tr>
                              <th>标的</th>
                              <th class="text-right">根数</th>
                              <th class="text-right">首根</th>
                              <th class="text-right">尾根</th>
                              <th class="text-right">缺口</th>
                              <th class="text-right">最大断档</th>
                              <th class="text-right">文件</th>
                              <th>备注</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr v-for="row in symbolsOnDate(r.date)" :key="row.folder" :class="rowIssue(row) ? 'row-issue' : ''">
                              <td class="font-mono">{{ row.symbol }}</td>
                              <td class="text-right font-mono">{{ num(row.bars) }}</td>
                              <td class="text-right font-mono text-muted">{{ row.bars ? clock(row.firstT) : '—' }}</td>
                              <td class="text-right font-mono text-muted">{{ row.bars ? clock(row.lastT) : '—' }}</td>
                              <td class="text-right font-mono" :class="row.missing ? 'text-warn' : 'text-faint'">
                                {{ row.missing ? num(row.missing) : '—' }}
                              </td>
                              <td class="text-right font-mono" :class="row.maxGap > meta.step ? 'text-muted' : 'text-faint'">
                                {{ row.bars > 1 ? gap(row.maxGap) : '—' }}
                              </td>
                              <td class="text-right font-mono text-muted">{{ bytes(row.bytes) }}</td>
                              <td>
                                <span v-if="row.err" class="badge badge-bad" :title="row.err">读不了</span>
                                <span v-if="row.skipped" class="badge badge-bad">坏 {{ num(row.skipped) }} 行</span>
                                <span v-if="row.dupes" class="badge badge-bad">重复 {{ num(row.dupes) }} 行</span>
                                <span v-if="!row.err && !row.skipped && !row.dupes" class="text-faint">—</span>
                              </td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </section>
      </template>

      <footer class="mt-8 text-center text-[11.5px] text-faint">
        <p>tradingview-j v{{ meta.version }} · 只读快照，页面上的任何操作都不会改动数据目录里的文件</p>
        <p class="mt-1">刷新页面或点「重新扫描」会重新读一遍磁盘</p>
      </footer>
    </template>
  </main>
</div>

<!-- 日历格子的模板。**必须放在 #app 外面** —— 放进 #app 会被 Vue 当成页面模板编译，
     而这里的用法是「取出 innerHTML 当作组件的模板字符串」（见 app.js 的 CalGrid）。 -->
<template id="tv-cal-tpl">
  <div class="cal-grid">
    <div v-for="w in wd" :key="w" class="cal-wd">{{ w }}</div>
    <template v-for="(c, i) in cells" :key="i">
      <div v-if="!c.date" class="cal-cell cal-blank"></div>
      <button v-else type="button" class="cal-cell" :class="cls(c)" :disabled="!c.have" :title="tip(c)" @click="$emit('pick', c)">
        <span class="cal-day">{{ c.day }}</span>
        <span v-if="c.have" class="cal-bars">{{ num(c.bars) }}</span>
        <span v-if="c.have && c.sub" class="cal-sub">{{ c.sub }}</span>
      </button>
    </template>
  </div>
</template>

<script src="/static/vendor/vue.global.prod.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
